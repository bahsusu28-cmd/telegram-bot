<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verised</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        .splash img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .container {
            display: none;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
        }

        .container.active {
            display: flex;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .wallet-status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #999;
            font-size: 14px;
        }

        .btn-connect {
            background: #0098EA;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wallet-balance {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .balance-label {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .wallet-actions {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            flex: 1;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5px 15px;
            color: #666;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.4;
        }

        .nav-item.active .nav-icon img {
            opacity: 1;
        }

        .nav-label {
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <img src="logo.jpg" alt="Logo">
    </div>

    <div class="container" id="mainContainer">
        <div class="content">
            <div class="wallet-header">
                <div class="wallet-status">
                    <span>💳</span>
                    <span id="walletStatus">Wallet not connected</span>
                </div>
                <button class="btn-connect" id="connectBtn">
                    Connect ➕
                </button>
            </div>

            <div class="wallet-balance">
                <div class="balance-label">Verised wallet balance</div>
                <div class="balance-amount" id="balanceAmount">0 TON</div>
                <div class="wallet-actions">
                    <button class="btn-action" onclick="deposit()">Deposit ➕</button>
                    <button class="btn-action" onclick="withdraw()">Withdraw ⬆️</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon"><img src="home.svg" alt="Главная"></div>
                <div class="nav-label">Главная</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"><img src="market.svg" alt="Рынок"></div>
                <div class="nav-label">Рынок</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"><img src="games.svg" alt="Игры"></div>
                <div class="nav-label">Игры</div>
            </div>
            <div class="nav-item active">
                <div class="nav-icon"><img src="wallet.svg" alt="Кошелек"></div>
                <div class="nav-label">Кошелек</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"><img src="settings.svg" alt="Настройки"></div>
                <div class="nav-label">Настройки</div>
            </div>
        </div>
    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://telegram-bot-five-indol-50.vercel.app/tonconnect-manifest.json',
            buttonRootId: null
        });

        let userWallet = null;

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                userWallet = wallet;
                updateWalletUI(true);
                loadBalance();
            } else {
                userWallet = null;
                updateWalletUI(false);
            }
        });

        function updateWalletUI(connected) {
            const statusEl = document.getElementById('walletStatus');
            const connectBtn = document.getElementById('connectBtn');

            if (connected && userWallet) {
                const address = userWallet.account.address;
                const shortAddress = address.slice(0, 4) + '...' + address.slice(-4);
                statusEl.textContent = shortAddress;
                connectBtn.textContent = 'Disconnect';
                connectBtn.onclick = disconnectWallet;
            } else {
                statusEl.textContent = 'Wallet not connected';
                connectBtn.innerHTML = 'Connect ➕';
                connectBtn.onclick = connectWallet;
                document.getElementById('balanceAmount').textContent = '0 TON';
            }
        }

        async function loadBalance() {
            if (!userWallet) return;

            try {
                const address = userWallet.account.address;
                const response = await fetch(`https://toncenter.com/api/v2/getAddressBalance?address=${address}`);
                const data = await response.json();
                
                if (data.ok) {
                    const balance = parseInt(data.result) / 1000000000;
                    document.getElementById('balanceAmount').textContent = balance.toFixed(2) + ' TON';
                }
            } catch (error) {
                console.error('Error loading balance:', error);
            }
        }

        async function connectWallet() {
            await tonConnectUI.openModal();
        }

        async function disconnectWallet() {
            await tonConnectUI.disconnect();
        }

        function deposit() {
            if (!userWallet) {
                alert('Сначала подключите кошелек');
                return;
            }
            alert('Адрес для пополнения:\n' + userWallet.account.address);
        }

        async function withdraw() {
            if (!userWallet) {
                alert('Сначала подключите кошелек');
                return;
            }

            const amount = prompt('Введите сумму для вывода (TON):');
            if (!amount || isNaN(amount) || parseFloat(amount) <= 0) {
                return;
            }

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 60,
                    messages: [
                        {
                            address: userWallet.account.address,
                            amount: (parseFloat(amount) * 1000000000).toString()
                        }
                    ]
                };

                await tonConnectUI.sendTransaction(transaction);
                alert('Транзакция отправлена!');
                setTimeout(loadBalance, 3000);
            } catch (error) {
                console.error('Transaction error:', error);
                alert('Ошибка: ' + error.message);
            }
        }

        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
            document.getElementById('mainContainer').classList.add('active');
            
            if (tonConnectUI.wallet) {
                userWallet = tonConnectUI.wallet;
                updateWalletUI(true);
                loadBalance();
            }
        }, 1000);
    </script>
</body>
</html>
