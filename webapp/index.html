<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verised</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        .splash.hide {
            opacity: 0;
            pointer-events: none;
        }

        .splash img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .container {
            display: none;
            flex-direction: column;
            height: 100vh;
            padding-bottom: 70px;
        }

        .container.active {
            display: flex;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .content h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }

        .content p {
            font-size: 16px;
            color: #999;
            line-height: 1.5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5px 15px;
            color: #666;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.4;
        }

        .nav-item.active .nav-icon img {
            opacity: 1;
        }

        .nav-label {
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <img src="logo.jpg" alt="Logo">
    </div>

    <div class="container" id="mainContainer">
        <div class="content">
            <h1>⚙️ Настройки</h1>
            <p>Здесь будут настройки приложения</p>
        </div>

        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon"><img src="home.png" alt="Главная"></div>
                <div class="nav-label">Главная</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"><img src="market.png" alt="Рынок"></div>
                <div class="nav-label">Рынок</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"><img src="games.png" alt="Игры"></div>
                <div class="nav-label">Игры</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon"><img src="wallet.png" alt="Кошелек"></div>
                <div class="nav-label">Кошелек</div>
            </div>
            <div class="nav-item active">
                <div class="nav-icon"><img src="settings.png" alt="Настройки"></div>
                <div class="nav-label">Настройки</div>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
            document.getElementById('mainContainer').classList.add('active');
        }, 1000);
    </script>
</body>
</html>
