<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.5s;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.5s;
        }
        
        .card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .info-label {
            opacity: 0.8;
        }
        
        .info-value {
            font-weight: 600;
        }
        
        .button {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .counter {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emoji {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Mini App</h1>
            <p>Добро пожаловать в тестовое приложение</p>
        </div>
        
        <div class="card">
            <h2><span class="emoji">👤</span> Ваш профиль</h2>
            <div class="user-info" id="userInfo">
                <div class="info-item">
                    <span class="info-label">Загрузка...</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2><span class="emoji">🎮</span> Счетчик кликов</h2>
            <div class="counter" id="counter">0</div>
            <div class="actions">
                <button class="button" onclick="increment()">➕ Добавить</button>
                <button class="button" onclick="decrement()">➖ Убрать</button>
            </div>
            <button class="button" onclick="reset()">🔄 Сбросить</button>
        </div>
        
        <div class="card">
            <h2><span class="emoji">🎲</span> Случайное число</h2>
            <div class="counter" id="random">?</div>
            <button class="button" onclick="generateRandom()">🎰 Генерировать</button>
        </div>
        
        <div class="card">
            <h2><span class="emoji">⚡</span> Действия</h2>
            <button class="button" onclick="sendData()">📤 Отправить данные боту</button>
            <button class="button" onclick="closeApp()">❌ Закрыть приложение</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let counter = 0;
        
        // Инициализация
        tg.ready();
        tg.expand();
        
        // Настройка темы
        document.body.style.background = tg.themeParams.bg_color || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        
        // Отображение информации о пользователе
        const userInfo = document.getElementById('userInfo');
        const user = tg.initDataUnsafe.user;
        
        if (user) {
            userInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">ID</span>
                    <span class="info-value">${user.id}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Имя</span>
                    <span class="info-value">${user.first_name || 'Не указано'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Username</span>
                    <span class="info-value">@${user.username || 'Не указан'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Язык</span>
                    <span class="info-value">${user.language_code || 'ru'}</span>
                </div>
            `;
        } else {
            userInfo.innerHTML = '<div class="info-item"><span class="info-label">Информация недоступна</span></div>';
        }
        
        // Функции счетчика
        function increment() {
            counter++;
            updateCounter();
            tg.HapticFeedback.impactOccurred('light');
        }
        
        function decrement() {
            if (counter > 0) {
                counter--;
                updateCounter();
                tg.HapticFeedback.impactOccurred('light');
            }
        }
        
        function reset() {
            counter = 0;
            updateCounter();
            tg.HapticFeedback.notificationOccurred('success');
        }
        
        function updateCounter() {
            document.getElementById('counter').textContent = counter;
        }
        
        // Генерация случайного числа
        function generateRandom() {
            const random = Math.floor(Math.random() * 100) + 1;
            document.getElementById('random').textContent = random;
            tg.HapticFeedback.impactOccurred('medium');
        }
        
        // Отправка данных боту
        function sendData() {
            const data = {
                action: 'data_from_webapp',
                counter: counter,
                timestamp: Date.now(),
                userId: user?.id
            };
            tg.sendData(JSON.stringify(data));
            tg.HapticFeedback.notificationOccurred('success');
        }
        
        // Закрытие приложения
        function closeApp() {
            tg.close();
        }
        
        // Настройка главной кнопки
        tg.MainButton.text = 'Отправить данные';
        tg.MainButton.color = '#667eea';
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            sendData();
        });
    </script>
</body>
</html>
